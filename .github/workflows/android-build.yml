name: 🤖 JARVIS Android Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend/app backend/tests

      - name: Run tests
        run: python -m pytest
        working-directory: backend

  android-build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode release keystore (only when secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "🔑 Release keystore decoded"
          else
            echo "ℹ️ No release keystore in secrets — release APK will be debug-signed (installable, not store-ready)"
          fi

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        working-directory: android
        run: |
          if [ -f "$GITHUB_WORKSPACE/android/app/release.keystore" ]; then
            echo "🔑 Building with release keystore"
            export KEYSTORE_FILE="$GITHUB_WORKSPACE/android/app/release.keystore"
            export KEYSTORE_PASSWORD="${{ secrets.JARVIS_KEYSTORE_PASSWORD }}"
            export KEY_ALIAS="${{ secrets.JARVIS_KEY_ALIAS }}"
            export KEY_PASSWORD="${{ secrets.JARVIS_KEY_PASSWORD }}"
          else
            echo "⚠️ No keystore — release APK will be debug-signed"
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Verify APKs are real
        run: |
          python3 - <<'PY'
          import os, zipfile
          apks = [
              "android/app/build/outputs/apk/debug/app-debug.apk",
              "android/app/build/outputs/apk/release/app-release.apk",
          ]
          for f in apks:
              size = os.path.getsize(f)
              with zipfile.ZipFile(f) as z:
                  names = set(z.namelist())
              assert "AndroidManifest.xml" in names, f"{f}: AndroidManifest.xml missing"
              assert any(n.startswith("classes") and n.endswith(".dex") for n in names), f"{f}: no .dex found"
              assert size > 1_000_000, f"{f}: suspiciously small ({size} bytes) — not a real APK"
              print(f"✅ {f}: {size / 1e6:.2f} MB, {len(names)} entries")
          PY

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: jarvis-*-apk
          merge-multiple: true
          path: ./artifacts

      - name: Rename APKs with version
        working-directory: ./artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app-debug.apk "jarvis-v${VERSION}-debug.apk"
          cp app-release.apk "jarvis-v${VERSION}-release.apk"
          python3 - <<PY
          import hashlib, pathlib
          for p in sorted(pathlib.Path('.').glob('jarvis-*.apk')):
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              pathlib.Path(f"{p}.sha256").write_text(f"{digest}  {p.name}\n")
          PY
          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/jarvis-*.apk
            ./artifacts/jarvis-*.apk.sha256
          body_path: releases/RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
