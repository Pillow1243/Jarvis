name: 🤖 JARVIS Android Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Lint backend
        run: |
          pip install ruff
          ruff check backend/app || true
      - name: Health check import
        run: python -c "import sys; sys.path.insert(0,'backend'); from app.main import app; print('✅ Backend OK')"

  android-build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x android/gradlew || echo "no gradlew yet, generating wrapper"

      - name: Generate Gradle Wrapper (if missing)
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.6 || echo "wrapper gen fallback"
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (unsigned, for CI; signed in release job)
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: List APKs
        run: find android -name "*.apk" -type f | xargs ls -lh

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R ./artifacts || true; find . -name "*.apk" | xargs ls -lh || true

      - name: Generate changelog
        run: |
          echo "## 🤖 JARVIS ${{ github.ref_name }}" > changelog.md
          echo "" >> changelog.md
          echo "فوق‌العاده‌ترین دستیار اندروید — قوی‌تر از OpenJarvis" >> changelog.md
          echo "" >> changelog.md
          echo "### ✨ ویژگی‌ها" >> changelog.md
          echo "- 🎙️ دستیار صوتی Wake Word \"هی جارویس\"" >> changelog.md
          echo "- 📱 کنترل کامل گوشی via AccessibilityService" >> changelog.md
          echo "- 🧠 Backend FastAPI + OpenAI-compatible API" >> changelog.md
          echo "- 🎨 Jetpack Compose Material 3 UI + HUD Overlay" >> changelog.md
          echo "" >> changelog.md
          echo "### 📥 نصب" >> changelog.md
          echo "1. APK را دانلود کن" >> changelog.md
          echo "2. نصب → مجوزها را تایید کن" >> changelog.md
          echo "3. بگو: «هی جارویس، سلام»" >> changelog.md
          cat changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/**/*.apk
            ./artifacts/*.apk
          body_path: changelog.md
          generate_release_notes: true
          draft: false
          prerelease: false
