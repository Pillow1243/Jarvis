name: 🤖 JARVIS Android Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend/app backend/tests

      - name: Run tests
        run: python -m pytest
        working-directory: backend

  android-build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK & licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_DIR=$SDK_DIR"
          ls "$SDK_DIR" && ls "$SDK_DIR/platforms" || true
          # Accept licenses via sdkmanager when available…
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          # …and also materialize the well-known license hashes (idempotent)
          mkdir -p "$SDK_DIR/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd975f751698a77b662f1254ddbeed3901e976f9a\n' > "$SDK_DIR/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c03d6b0d7db\n' > "$SDK_DIR/licenses/android-sdk-preview-license"
          cat "$SDK_DIR/licenses/android-sdk-license" | head -2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode release keystore (only when secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "🔑 Release keystore decoded"
          else
            echo "ℹ️ No release keystore in secrets — release APK will be debug-signed (installable, not store-ready)"
          fi

      - name: Unit tests
        working-directory: android
        run: |
          set -e
          ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee build-test.log || {
            grep -E "^(e: |error|FAILURE|What went wrong|> Task .*FAILED|Caused by|.*\.kt:[0-9]+:[0-9]+)" build-test.log | tail -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Build Debug APK
        working-directory: android
        run: |
          set -e
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee build-debug.log || {
            grep -E "^(e: |error|FAILURE|What went wrong|> Task .*FAILED|Caused by|.*\.kt:[0-9]+:[0-9]+)" build-debug.log | tail -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Build Release APK
        working-directory: android
        run: |
          if [ -f "$GITHUB_WORKSPACE/android/app/release.keystore" ]; then
            echo "🔑 Building with release keystore"
            export KEYSTORE_FILE="$GITHUB_WORKSPACE/android/app/release.keystore"
            export KEYSTORE_PASSWORD="${{ secrets.JARVIS_KEYSTORE_PASSWORD }}"
            export KEY_ALIAS="${{ secrets.JARVIS_KEY_ALIAS }}"
            export KEY_PASSWORD="${{ secrets.JARVIS_KEY_PASSWORD }}"
          else
            echo "⚠️ No keystore — release APK will be debug-signed"
          fi
          set -e
          ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tee build-release.log || {
            grep -E "^(e: |error|FAILURE|What went wrong|> Task .*FAILED|Caused by|.*\.kt:[0-9]+:[0-9]+)" build-release.log | tail -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Verify APKs are real
        run: |
          find android -name "*.apk" -not -path "*/node_modules/*" -print | while IFS= read -r f; do
            echo "::notice::found APK: $f ($(stat -c%s "$f") bytes)"
          done
          python3 - <<'PY'
          import os, sys, zipfile
          apks = [
              "android/app/build/outputs/apk/debug/app-debug.apk",
              "android/app/build/outputs/apk/release/app-release.apk",
          ]
          failed = False
          for f in apks:
              if not os.path.exists(f):
                  print(f"::error file={f}::APK not found — expected build output missing")
                  failed = True
                  continue
              size = os.path.getsize(f)
              try:
                  with zipfile.ZipFile(f) as z:
                      names = set(z.namelist())
              except zipfile.BadZipFile:
                  print(f"::error file={f}::Not a valid zip/APK")
                  failed = True
                  continue
              has_manifest = "AndroidManifest.xml" in names
              has_dex = any(n.startswith("classes") and n.endswith(".dex") for n in names)
              print(f"::notice file={f}::{size/1e6:.2f} MB, {len(names)} entries, manifest={has_manifest}, dex={has_dex}")
              if not has_manifest or not has_dex:
                  print(f"::error file={f}::Missing manifest={not has_manifest} or dex={not has_dex}")
                  failed = True
              if size < 300_000:
                  print(f"::error file={f}::Suspiciously small APK ({size} bytes)")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: jarvis-*-apk
          merge-multiple: true
          path: ./artifacts

      - name: Rename APKs with version
        working-directory: ./artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app-debug.apk "jarvis-v${VERSION}-debug.apk"
          cp app-release.apk "jarvis-v${VERSION}-release.apk"
          python3 - <<PY
          import hashlib, pathlib
          for p in sorted(pathlib.Path('.').glob('jarvis-*.apk')):
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              pathlib.Path(f"{p}.sha256").write_text(f"{digest}  {p.name}\n")
          PY
          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/jarvis-*.apk
            ./artifacts/jarvis-*.apk.sha256
          body_path: releases/RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
