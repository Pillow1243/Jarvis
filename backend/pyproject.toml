[project]
name = "jarvis-android-backend"
version = "2.0.0"
description = "JARVIS Android Backend — FastAPI + Agents + Device Control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "JARVIS Android Team" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "redis>=5.0",
    "celery>=5.3",
    "openai>=1.30",
    "anthropic>=0.30",
    "google-generativeai>=0.5",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "tiktoken>=0.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "loguru>=0.7",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx", "ruff", "mypy", "pre-commit"]
speech = ["openai-whisper>=20231117", "TTS>=0.22", "pyaudio>=0.2.13"]

[project.scripts]
jarvis-server = "app.main:app"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
